name: Build

on:
  push:
    branches: [ "1.*" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build for all platforms
        run: ./gradlew clean buildAll :common:test -PdevMods.enabled=false --no-daemon

      - uses: actions/upload-artifact@v6
        with:
          name: 'mod-jars'
          path: 'build/libs/*.jar'
