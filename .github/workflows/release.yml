name: Release Readiness (Publishing Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Build all loader artifacts
        run: ./gradlew buildAll --no-daemon

      - name: Upload unreviewed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Confirm publishing is disabled
        run: echo "Publishing is disabled; no release or platform upload was attempted."
